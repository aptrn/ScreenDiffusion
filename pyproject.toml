[project]
name = "screendiffusion"
version = "0.2.0"
description = "Real-time image-to-image screen renderer built on StreamDiffusion"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.11.*"

dependencies = [
    # --- PyTorch (CUDA 12.8 build, from the dedicated PyTorch index below) ---
    "torch==2.7.0+cu128",
    "torchvision==0.22.0+cu128",

    # --- Core AI framework (version-locked: StreamDiffusion needs these exact majors) ---
    "transformers==4.36.2",
    "diffusers==0.24.0",
    "huggingface-hub==0.22.2",
    "streamdiffusion[tensorrt]==0.1.1",

    # --- TensorRT compilation tools & CUDA bindings ---
    "tensorrt==10.8.0.43",
    "tensorrt-cu12==10.8.0.43",
    # The two packages above are thin metapackages; these carry the actual
    # Python bindings and native .dll payload, and live only on NVIDIA's index.
    "tensorrt-cu12-bindings==10.8.0.43",
    "tensorrt-cu12-libs==10.8.0.43",
    "polygraphy",
    "onnx",
    "onnx-graphsurgeon",
    "cuda-python==12.8.0",

    # --- UI, screen capture, and utilities ---
    "customtkinter",
    "pillow",
    "numpy==1.26.4",
    "dxcam",
    "mss",
    "opencv-python==4.10.0.84",

    # --- Open-vocabulary detection (issue #4, spec 8.1) ---
    # NOTE: ultralytics is AGPL-3.0 and this project is MIT. Fine for benchmarking;
    # shipping it is a licensing decision that has not been taken.
    # `clip` is ultralytics' fork, and is what YOLO-World encodes a vocabulary with.
    # ultralytics pip-installs it from git on first use if it is absent; pinning it
    # here puts it in the lockfile instead of in a surprise subprocess.
    "ultralytics>=8.4.142",
    "clip",
]

# xformers is intentionally omitted: on cu128 it fails to build, and RTX 30/40/50
# series fall back to PyTorch's native SDPA (Flash Attention) anyway.

[tool.uv]
# Flat script layout (main_gpu_addon.py / wrapper.py) - nothing to build or install.
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
tensorrt-cu12-bindings = { index = "nvidia" }
tensorrt-cu12-libs = { index = "nvidia" }
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# NVIDIA's current package index. Note: the older `pypi.ngc.nvidia.com` host
# no longer resolves - use this one.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root on sys.path, so the tests can `import bench` the same way
# `python -m bench` does.
pythonpath = ["."]
# --strict-markers: an unregistered marker is an error, so a typo'd @pytest.mark.gpu
# cannot quietly land a GPU test in the tier the merge gate runs.
addopts = "--strict-markers"
markers = [
    "gpu: requires a CUDA GPU + TensorRT",
]
